spring.application.name=cricory-backend
spring.profiles.default=postgres

# Headless browser scraping is opt-in. Keep the target and allowed hosts in
# backend configuration; never accept an arbitrary URL directly from clients.
cricory.scraping.enabled=true
cricory.scraping.remote-enabled=false
cricory.news.remote-enabled=true
cricory.scraping.target-url=https://www.cricinfo.com/live-cricket-score
cricory.scraping.allowed-hosts=cricinfo.com
cricory.scraping.headless=true

# REST controllers read database snapshots only. Scraping is performed by
# background jobs and failed refreshes keep the last successful DB snapshot.
management.health.redis.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
cricory.scraping.navigation-timeout=30s
cricory.scraping.max-text-length=20000
cricory.scraping.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36

# Cache intervals chosen by how quickly each page changes.
cricory.scraping.live-cache-ttl=20s
cricory.scraping.upcoming-cache-ttl=30m
cricory.scraping.results-cache-ttl=15m

# Background refresh requirements.
cricory.sync.live=20s
cricory.sync.upcoming=30m
cricory.sync.recent=15m
cricory.sync.news=10m
cricory.sync.live-scorecards=60s
cricory.sync.recent-scorecards=30m
spring.task.scheduling.pool.size=2
