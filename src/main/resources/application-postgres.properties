spring.config.import=optional:file:./config/local-secrets.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cricory}
spring.datasource.username=${DB_USERNAME:cricory}
spring.datasource.password=${DB_PASSWORD:${cricory.local-db-password:cricory_dev_password}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
cricory.scraping.remote-enabled=true

# PostgreSQL is persistent; H2 remains the default zero-setup development DB.
