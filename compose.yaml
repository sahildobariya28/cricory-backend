services:
  postgres:
    image: postgres:17-alpine
    container_name: cricory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cricory
      POSTGRES_USER: cricory
      POSTGRES_PASSWORD: cricory_dev_password
    ports:
      - "5432:5432"
    volumes:
      - cricory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cricory -d cricory"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: cricory-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cricory.local
      PGADMIN_DEFAULT_PASSWORD: admin_dev_password
    ports:
      - "5050:80"
    volumes:
      - cricory_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cricory_postgres_data:
  cricory_pgadmin_data:
